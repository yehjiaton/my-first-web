<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小角落 ✨</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入可愛圓潤的思源黑體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="card-box">
        <!-- 可愛小裝飾圖示 -->
        <div class="sticker">🧸 ☁️ 🌱</div>

        <!-- 輕鬆無壓力的短句（之後可以用 Git 練習修改這行！） -->
        <p class="mood-text">今天也是慢慢寫扣、喝杯奶茶的一天 🧋</p>

        <!-- 圓滾滾的快捷按鈕 -->
        <nav class="btn-group">
            <a href="#" class="cute-btn pink">📸 日常碎片</a>
            <a href="#" class="cute-btn yellow">📝 隨手筆記</a>
            <a href="#" class="cute-btn blue">🎧 正在聽的歌</a>
            <a href="#" class="cute-btn green">💌 傳個訊息</a>
        </nav>

        <!-- 2x2 拍立得風小圖卡 -->
        <section class="photo-grid">
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=500&q=80" alt="小貓">
                <span>發呆時間 🐾</span>
            </div>
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=500&q=80" alt="咖啡">
                <span>下午茶補給 ☕</span>
            </div>
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=500&q=80" alt="植物">
                <span>桌邊小盆栽 🌿</span>
            </div>
            <div class="polaroid">
                <img src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=500&q=80" alt="書本">
                <span>週末閱讀 📖</span>
            </div>
        </section>
    </main>

</body>
</html>
