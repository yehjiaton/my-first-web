<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小角落 ✨</title>
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="card-box">
        <div class="sticker">🧸 ☁️ 🌱</div>
        <p class="mood-text">今天也是慢慢寫扣、喝杯奶茶的一天</p>

        <!-- 五顆可愛按鈕 -->
        <nav class="btn-group">
            <button type="button" class="cute-btn pink" onclick="nextPhoto()">🔄 換一張</button>
            <button type="button" class="cute-btn yellow" onclick="openModal('noteModal')">📝 隨手筆記</button>
            <button type="button" class="cute-btn blue" onclick="openModal('musicModal')">🎧 正在聽的歌</button>
            <button type="button" class="cute-btn green" onclick="openModal('msgModal')">💌 傳個訊息</button>
            <button type="button" class="cute-btn purple full-span" onclick="openHistoryModal()">📖 大家的手帳回顧本</button>
        </nav>

        <!-- 單張拍立得展示區 -->
        <section class="single-photo-wrap">
            <div class="polaroid">
                <img id="mainPhoto" src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=700&q=80" alt="日常照片">
                <div class="photo-caption">
                    <span id="photoTitle">發呆時間 🐾</span>
                    <span id="photoCounter" class="counter">1 / 8</span>
                </div>
            </div>
        </section>
    </main>

    <!-- 彈窗 1：隨手筆記 -->
    <div class="modal-overlay" id="noteModal" onclick="closeOnOutside(event, 'noteModal')">
        <div class="modal-card yellow-border">
            <button type="button" class="close-btn" onclick="closeModal('noteModal')">✕</button>
            <h3>📝 隨手小便條</h3>
            <p class="modal-desc">寫下的內容會同步到雲端，只有本人可以刪除喔！</p>
            <textarea id="noteInput" rows="4" placeholder="分享現在的想法或靈感..." required></textarea>
            <button type="button" class="action-btn yellow" onclick="saveNote()">發佈這則筆記 ✨</button>
            <p class="status-msg" id="noteStatus"></p>
        </div>
    </div>

    <!-- 彈窗 2：正在聽的歌 -->
    <div class="modal-overlay" id="musicModal" onclick="closeOnOutside(event, 'musicModal')">
        <div class="modal-card blue-border">
            <button type="button" class="close-btn" onclick="closeModal('musicModal')">✕</button>
            <h3>🎧 今日循環播放</h3>
            <div class="music-box">
                <span class="vinyl">💿</span>
                <div>
                    <strong>Lo-Fi 寫扣專用純音樂</strong>
                    <p>適合配著雨聲與熱奶茶一起聽 🎶</p>
                </div>
            </div>
            <a href="https://www.youtube.com/results?search_query=lofi+hip+hop+radio" target="_blank" class="action-btn blue">前往 YouTube 聽歌 ↗</a>
        </div>
    </div>

    <!-- 彈窗 3：傳個訊息 -->
    <div class="modal-overlay" id="msgModal" onclick="closeOnOutside(event, 'msgModal')">
        <div class="modal-card green-border">
            <button type="button" class="close-btn" onclick="closeModal('msgModal')">✕</button>
            <h3>💌 丟個小紙條給大家</h3>
            <form onsubmit="sendMessage(event)">
                <input type="text" id="senderInput" placeholder="你的暱稱（沒填會顯示匿名小可愛）">
                <textarea id="msgInput" rows="3" placeholder="想對大家說什麼都可以..." required></textarea>
                <button type="submit" class="action-btn green">發送紙條 🚀</button>
            </form>
            <p class="status-msg" id="msgStatus"></p>
        </div>
    </div>

    <!-- 彈窗 4：雲端連線版時光回顧本 -->
    <div class="modal-overlay" id="historyModal" onclick="closeOnOutside(event, 'historyModal')">
        <div class="modal-card history-card">
            <div class="binder-rings">
                <span></span><span></span><span></span><span></span><span></span>
            </div>

            <button type="button" class="close-btn" onclick="closeModal('historyModal')">✕</button>
            
            <div class="history-header">
                <span class="history-badge">☁️ LIVE SYNC · 雲端即時共享</span>
                <h3>📖 大家的手帳回顧本</h3>
            </div>
            
            <!-- 膠囊切換器 -->
            <div class="segmented-tabs">
                <button type="button" id="tabNotes" class="seg-btn active" onclick="switchTab('notes')">
                    📝 筆記 <span class="count-pill" id="noteCount">0</span>
                </button>
                <button type="button" id="tabMsgs" class="seg-btn" onclick="switchTab('msgs')">
                    💌 紙條 <span class="count-pill" id="msgCount">0</span>
                </button>
            </div>

            <!-- 紀錄清單顯示區 -->
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- 引入 Firebase 即時資料庫 SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://my-first-web-87135-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const notesRef = ref(db, 'shared_notes');
        const msgsRef = ref(db, 'shared_msgs');

        // 為目前這台裝置產生並記住專屬的隱藏通行碼（用於判斷是否為本人）
        function getMyDeviceId() {
            let myId = localStorage.getItem('cute_web_owner_id');
            if (!myId) {
                myId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 10);
                localStorage.setItem('cute_web_owner_id', myId);
            }
            return myId;
        }
        const myOwnerId = getMyDeviceId();

        let notesData = [];
        let msgsData = [];
        let currentTab = 'notes';

        onValue(notesRef, (snapshot) => {
            const val = snapshot.val();
            notesData = val ? Object.entries(val).map(([key, item]) => ({ key, ...item })).reverse() : [];
            renderHistory();
        });

        onValue(msgsRef, (snapshot) => {
            const val = snapshot.val();
            msgsData = val ? Object.entries(val).map(([key, item]) => ({ key, ...item })).reverse() : [];
            renderHistory();
        });

        function getNowTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            return `${y}/${m}/${d} · ${hh}:${mm}`;
        }

        window.saveNote = async function() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) return;

            const status = document.getElementById('noteStatus');
            status.textContent = "傳送到雲端中... ☁️";

            try {
                await push(notesRef, {
                    text: text,
                    time: getNowTime(),
                    ownerId: myOwnerId
                });
                input.value = "";
                status.textContent = "已發佈！大家都能看到囉 🧸";
                setTimeout(() => {
                    status.textContent = "";
                    closeModal('noteModal');
                }, 1100);
            } catch (err) {
                status.textContent = "傳送失敗，請確認 Firebase 權限設定 ⚠️";
            }
        };

        window.sendMessage = async function(event) {
            event.preventDefault();
            const senderInput = document.getElementById('senderInput');
            const msgInput = document.getElementById('msgInput');
            
            const sender = senderInput.value.trim() || "匿名小可愛";
            const text = msgInput.value.trim();
            if (!text) return;

            const status = document.getElementById('msgStatus');
            status.textContent = "紙條飛行中... 🚀";

            try {
                await push(msgsRef, {
                    sender: sender,
                    text: text,
                    time: getNowTime(),
                    ownerId: myOwnerId
                });
                senderInput.value = "";
                msgInput.value = "";
                status.textContent = "已貼到大家的回顧本！💌";
                setTimeout(() => {
                    status.textContent = "";
                    closeModal('msgModal');
                }, 1100);
            } catch (err) {
                status.textContent = "發送失敗，請確認 Firebase 權限設定 ⚠️";
            }
        };

        window.switchTab = function(tab) {
            currentTab = tab;
            document.getElementById('tabNotes').classList.toggle('active', tab === 'notes');
            document.getElementById('tabMsgs').classList.toggle('active', tab === 'msgs');
            renderHistory();
        };

        window.openHistoryModal = function() {
            openModal('historyModal');
            renderHistory();
        };

        window.deleteItem = function(type, key) {
            const targetList = type === 'notes' ? notesData : msgsData;
            const targetItem = targetList.find(item => item.key === key);

            // 雙重確認：只有本人發佈的才能刪除
            if (!targetItem || targetItem.ownerId !== myOwnerId) {
                return;
            }

            if (type === 'notes') {
                remove(ref(db, `shared_notes/${key}`));
            } else {
                remove(ref(db, `shared_msgs/${key}`));
            }
        };

        function renderHistory() {
            document.getElementById('noteCount').textContent = notesData.length;
            document.getElementById('msgCount').textContent = msgsData.length;

            const listEl = document.getElementById('historyList');
            listEl.innerHTML = "";

            if (currentTab === 'notes') {
                if (notesData.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-box">
                            <div class="empty-icon">📒</div>
                            <p>雲端筆記本還是空的呢～</p>
                            <span>點「📝 隨手筆記」寫下第一張跟大家分享吧！</span>
                        </div>`;
                    return;
                }
                notesData.forEach(item => {
                    const isMine = item.ownerId === myOwnerId;
                    const div = document.createElement('div');
                    div.className = 'diary-card note-style';
                    div.innerHTML = `
                        <div class="tape"></div>
                        <div class="diary-top">
                            <span class="time-chip">🗓️ ${item.time}</span>
                            ${isMine ? `<button type="button" class="del-icon-btn" title="刪除" onclick="deleteItem('notes', '${item.key}')">✕</button>` : ''}
                        </div>
                        <p class="diary-body"></p>
                    `;
                    div.querySelector('.diary-body').textContent = item.text;
                    listEl.appendChild(div);
                });
            } else {
                if (msgsData.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-box">
                            <div class="empty-icon">📮</div>
                            <p>大家還沒投遞紙條喔～</p>
                            <span>點「💌 傳個訊息」留下第一封吧！</span>
                        </div>`;
                    return;
                }
                msgsData.forEach(item => {
                    const isMine = item.ownerId === myOwnerId;
                    const div = document.createElement('div');
                    div.className = 'diary-card msg-style';
                    div.innerHTML = `
                        <div class="diary-top">
                            <div class="sender-badge">
                                <span class="mini-avatar">🐻</span>
                                <strong class="sender-name"></strong>
                            </div>
                            <div class="right-meta">
                                <span class="time-text">${item.time}</span>
                                ${isMine ? `<button type="button" class="del-icon-btn" title="刪除" onclick="deleteItem('msgs', '${item.key}')">✕</button>` : ''}
                            </div>
                        </div>
                        <p class="diary-body"></p>
                    `;
                    div.querySelector('.sender-name').textContent = item.sender;
                    div.querySelector('.diary-body').textContent = item.text;
                    listEl.appendChild(div);
                });
            }
        }
    </script>

    <!-- 基礎介面互動腳本 -->
    <script>
        const photos = [
            { url: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=700&q=80", title: "發呆時間 🐾" },
            { url: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=700&q=80", title: "下午茶補給 ☕" },
            { url: "https://images.unsplash.com/photo-1513542789411-b6a5d4f31634?auto=format&fit=crop&w=700&q=80", title: "桌邊小盆栽 🌿" },
            { url: "https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=700&q=80", title: "週末閱讀 📖" },
            { url: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=700&q=80", title: "散步遇到的小狗 🐶" },
            { url: "https://images.unsplash.com/photo-1551024601-bec78aea704b?auto=format&fit=crop&w=700&q=80", title: "甜甜圈療癒日 🍩" },
            { url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80", title: "去看海吹風 🌊" },
            { url: "https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=700&q=80", title: "隨手塗鴉色彩 🎨" }
        ];

        let currentIndex = 0;

        function nextPhoto() {
            currentIndex = (currentIndex + 1) % photos.length;
            document.getElementById('mainPhoto').src = photos[currentIndex].url;
            document.getElementById('photoTitle').textContent = photos[currentIndex].title;
            document.getElementById('photoCounter').textContent = `${currentIndex + 1} / ${photos.length}`;
        }

        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function closeOnOutside(event, id) {
            if (event.target.id === id) {
                closeModal(id);
            }
        }
    </script>

</body>
</html>
